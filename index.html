<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة شفرة</title>
    <style>
        body { background: #580c10; color: white; text-align: center; font-family: sans-serif; padding: 50px; }
        .user-box { background: #d4af37; color: #580c10; padding: 15px; border-radius: 10px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

    <h1 id="title">منصة شفرة</h1>
    <div id="auth-area">جاري التحقق...</div>

    <script>
        const authArea = document.getElementById('auth-area');

        function login() {
            window.location.href = "https://discord.com/oauth2/authorize?client_id=1124438537090121738&response_type=token&redirect_uri=https%3A%2F%2Fyuris6767m-blip.github.io%2Fshifra%2F&scope=identify";
        }

        // قراءة التوكن من الـ hash مباشرة دون إعادة تحميل
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const token = params.get('access_token');

        if (token) {
            // جلب بيانات المستخدم
            fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(user => {
                authArea.innerHTML = `<div class="user-box">أهلاً بك يا ${user.username} 👋</div>`;
            })
            .catch(() => {
                authArea.innerHTML = `<button onclick="login()" style="padding:10px; cursor:pointer;">خطأ في الجلسة، سجل الدخول مجدداً</button>`;
            });
        } else {
            authArea.innerHTML = `<button onclick="login()" style="padding:10px; cursor:pointer;">تسجيل الدخول عبر ديسكورد</button>`;
        }
    </script>
</body>
</html>
