<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة شفرة - تصحيح</title>
    <style>
        body { background: #580c10; color: white; text-align: center; padding: 50px; font-family: sans-serif; }
        .box { background: #d4af37; padding: 20px; border-radius: 10px; color: #580c10; display: inline-block; }
    </style>
</head>
<body>

    <h1>منصة شفرة</h1>
    <div id="debug-area">
        <button onclick="checkAuth()" style="padding:15px; cursor:pointer;">اضغط هنا للتحقق من هويتك</button>
    </div>

    <script>
        function checkAuth() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const token = params.get('access_token');

            if (!token) {
                alert("لا يوجد توكن في الرابط! سجل الدخول أولاً.");
                return;
            }

            fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(user => {
                document.getElementById('debug-area').innerHTML = `<div class="box">أهلاً بك يا ${user.username}</div>`;
            })
            .catch(err => {
                alert("خطأ في الاتصال: " + err);
            });
        }
    </script>
</body>
</html>
