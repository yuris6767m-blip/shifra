<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة شفرة</title>
    <style>
        body { background: #580c10; color: white; text-align: center; font-family: sans-serif; padding: 50px; }
        .user-box { background: #d4af37; color: #580c10; padding: 10px 20px; border-radius: 20px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

    <h1 id="title">منصة شفرة</h1>
    <div id="auth-status">جاري التحقق...</div>

    <script>
        const authStatus = document.getElementById('auth-status');
        
        // التحقق من وجود توكن في الرابط
        if (window.location.hash) {
            const params = new URLSearchParams(window.location.hash.substring(1));
            const token = params.get('access_token');

            if (token) {
                // جلب البيانات من ديسكورد
                fetch('https://discord.com/api/users/@me', {
                    headers: { Authorization: `Bearer ${token}` }
                })
                .then(res => res.json())
                .then(user => {
                    authStatus.innerHTML = `<div class="user-box">مرحباً ${user.username} 👋</div>`;
                    // تنظيف الرابط من التوكن بعد استخدامه لحماية خصوصيتك
                    window.history.replaceState(null, null, window.location.pathname);
                })
                .catch(() => {
                    authStatus.innerHTML = "حدث خطأ، يرجى المحاولة لاحقاً.";
                });
            }
        } else {
            // إذا لم يكن هناك توكن، أظهر زر تسجيل الدخول
            authStatus.innerHTML = `<a href="https://discord.com/oauth2/authorize?client_id=1124438537090121738&response_type=token&redirect_uri=https%3A%2F%2Fyuris6767m-blip.github.io%2Fshifra%2F&scope=identify" style="color:gold; font-weight:bold;">تسجيل الدخول عبر الديسكورد</a>`;
        }
    </script>
</body>
</html>
