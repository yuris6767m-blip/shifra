<script>
    const langData = {
        ar: { title: "منصة شفرة", desc: "الحاضنة التقنية الأولى للمبرمج العربي.", member: "عضو", btn: "English", hi: "مرحباً", login: "تسجيل الدخول" },
        en: { title: "Shifra Platform", desc: "The premier incubator for Arab developers.", member: "Member", btn: "العربية", hi: "Hello", login: "Login" }
    };

    let currentLang = localStorage.getItem('lang') || 'ar';

    function updatePage() {
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('txt-title').innerText = langData[currentLang].title;
        document.getElementById('txt-desc').innerText = langData[currentLang].desc;
        document.getElementById('txt-member').innerText = langData[currentLang].member;
        document.getElementById('btn-lang').innerText = langData[currentLang].btn;
    }

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        localStorage.setItem('lang', currentLang);
        updatePage();
    }

    // الدالة المسؤولة عن جلب بيانات المستخدم
    function fetchUserData(token) {
        fetch('https://discord.com/api/users/@me', { 
            headers: { Authorization: `Bearer ${token}` } 
        })
        .then(res => {
            if (!res.ok) throw new Error('Expired'); // إذا انتهت الصلاحية
            return res.json();
        })
        .then(user => {
            document.getElementById('user-area').innerHTML = 
                `<div class="user-box">${langData[currentLang].hi} ${user.username} 👋</div>`;
            document.getElementById('roles-area').style.display = 'block';
        })
        .catch(() => {
            // إذا حدث أي خطأ (انتهاء صلاحية أو غيره)، امسح التوكن وأظهر رابط الدخول
            window.location.hash = "";
            showLoginLink();
        });
    }

    function showLoginLink() {
        document.getElementById('user-area').innerHTML = `<a href="https://discord.com/oauth2/authorize?client_id=1124438537090121738&response_type=token&redirect_uri=https%3A%2F%2Fyuris6767m-blip.github.io%2Fshifra%2F&scope=identify" style="color:white">${langData[currentLang].login}</a>`;
    }

    // منطق التشغيل
    const fragment = new URLSearchParams(window.location.hash.slice(1));
    const token = fragment.get('access_token');

    if (token) {
        fetchUserData(token);
    } else {
        showLoginLink();
    }

    updatePage();
</script>
