<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة شفرة</title>
    <style>
        body { background: #580c10; color: white; text-align: center; font-family: sans-serif; padding: 50px; }
        .user-box { background: #d4af37; color: #580c10; padding: 15px; border-radius: 10px; display: inline-block; font-weight: bold; }
        .login-link { color: gold; font-weight: bold; text-decoration: none; font-size: 1.2em; }
    </style>
</head>
<body>

    <h1 id="main-title">منصة شفرة</h1>
    <div id="app">جاري المعالجة...</div>

    <script>
        // دالة لجلب البيانات مباشرة دون تدخل منك
        function init() {
            const app = document.getElementById('app');
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const token = params.get('access_token');

            if (token) {
                // جلب بيانات المستخدم
                fetch('https://discord.com/api/users/@me', {
                    headers: { Authorization: `Bearer ${token}` }
                })
                .then(res => res.json())
                .then(user => {
                    app.innerHTML = `<div class="user-box">أهلاً بك يا ${user.username} 👋</div>`;
                    // مسح الـ Token من الرابط فورياً ليبقى الرابط نظيفاً
                    window.history.replaceState({}, document.title, window.location.pathname);
                })
                .catch(() => {
                    app.innerHTML = "حدث خطأ، يرجى المحاولة لاحقاً.";
                });
            } else {
                // عرض رابط تسجيل الدخول
                app.innerHTML = `<a href="https://discord.com/oauth2/authorize?client_id=1124438537090121738&response_type=token&redirect_uri=https%3A%2F%2Fyuris6767m-blip.github.io%2Fshifra%2F&scope=identify" class="login-link">تسجيل الدخول عبر ديسكورد</a>`;
            }
        }

        // تشغيل الدالة فور تحميل الصفحة
        window.onload = init;
    </script>
</body>
</html>
