<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة شفرة</title>
    <style>
        /* دمج التصميم الأصلي */
        body { margin: 0; font-family: sans-serif; background: #580c10; color: white; }
        
        /* القائمة العلوية الجديدة */
        .top-nav { display: flex; justify-content: space-between; padding: 20px; background: #3c090a; align-items: center; }
        .menu-icon { cursor: pointer; font-size: 30px; color: gold; }

        /* التصميم الخاص بك */
        .hero { text-align: center; padding: 50px; }
        .card { background: #fdf6e3; color: #333; margin: 20px auto; padding: 30px; border-radius: 15px; max-width: 800px; }

        /* القائمة الجانبية */
        #sidebar { position: fixed; right: -250px; top: 0; width: 250px; height: 100%; background: #3c090a; padding: 20px; transition: 0.3s; z-index: 1000; box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        #sidebar.open { right: 0; }
        .side-link { display: block; color: gold; padding: 15px 0; text-decoration: none; border-bottom: 1px solid #580c10; }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="menu-icon" onclick="toggleSidebar()">☰</div>
    <div>منصة شفرة</div>
</div>

<div id="sidebar">
    <h3 style="color:gold;">القائمة</h3>
    <div id="auth-box"><a href="https://discord.com/oauth2/authorize?client_id=1124438537090121738&response_type=token&redirect_uri=https%3A%2F%2Fyuris6767m-blip.github.io%2Fshifra%2F&scope=identify" class="side-link">تسجيل الدخول</a></div>
    <a href="#" class="side-link" onclick="alert('يجب تسجيل الدخول')">لوحة التحكم</a>
    <button onclick="toggleSidebar()" style="margin-top:20px; cursor:pointer;">إغلاق</button>
</div>

<div class="hero">
    <h1>منصة شفرة</h1>
    <p>الحاضنة التقنية الأولى للمبرمج العربي والتمكين البرمجي الفعال.</p>
    
    <div class="card">
        <h2>عن منصة شفرة</h2>
        <p>نصك الجميل هنا... (هذا هو التصميم الذي كنت تقصده)</p>
    </div>
</div>

<script>
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

    // التحقق الصامت من الدخول
    const params = new URLSearchParams(window.location.hash.substring(1));
    const token = params.get('access_token');
    if (token) {
        localStorage.setItem('t', token);
        window.history.replaceState({}, document.title, window.location.pathname);
    }
    
    const t = localStorage.getItem('t');
    if (t) {
        fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${t}` } })
        .then(r => r.json())
        .then(u => { if(u.username) document.getElementById('auth-box').innerHTML = `<div style="color:white;">مرحباً ${u.username}</div>`; });
    }
</script>
</body>
</html>
