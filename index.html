<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة شفرة</title>
    <style>
        body { background: #580c10; color: white; text-align: center; font-family: sans-serif; padding: 50px; }
    </style>
</head>
<body>
    <h1>منصة شفرة</h1>
    <p>الحاضنة التقنية الأولى للمبرمج العربي.</p>
    <div id="content">جاري التحقق...</div>

    <script>
        // هذا الكود بسيط جداً ولا يمسح شيئاً
        const content = document.getElementById('content');
        
        // جرب تسجيل الدخول
        content.innerHTML = '<a href="https://discord.com/oauth2/authorize?client_id=1124438537090121738&response_type=token&redirect_uri=https%3A%2F%2Fyuris6767m-blip.github.io%2Fshifra%2F&scope=identify" style="color:gold;">اضغط هنا لتسجيل الدخول</a>';
        
        const params = new URLSearchParams(window.location.hash.substring(1));
        const token = params.get('access_token');
        
        if (token) {
            content.innerHTML = "تم استلام البيانات... جاري العرض";
            fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } })
            .then(res => res.json())
            .then(user => {
                content.innerHTML = "مرحباً " + user.username;
            });
        }
    </script>
</body>
</html>
