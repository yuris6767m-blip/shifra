<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة شفرة</title>
    <style>
        body { background: #580c10; color: white; text-align: center; font-family: sans-serif; padding: 50px; }
        .box { background: #d4af37; color: #580c10; padding: 15px; border-radius: 15px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

    <h1>منصة شفرة</h1>
    <div id="status">جاري التحقق...</div>

    <script>
        const statusDiv = document.getElementById('status');

        // 1. هل يوجد توكن في الرابط؟ احفظه في الذاكرة
        const fragment = new URLSearchParams(window.location.hash.substring(1));
        const token = fragment.get('access_token');
        
        if (token) {
            localStorage.setItem('user_token', token);
            window.location.href = window.location.pathname; // تنظيف الرابط
        }

        // 2. هل يوجد توكن في الذاكرة؟ استخدمه
        const savedToken = localStorage.getItem('user_token');

        if (savedToken) {
            fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${savedToken}` }
            })
            .then(res => res.json())
            .then(user => {
                if (user.username) {
                    statusDiv.innerHTML = `<div class="box">أهلاً بك يا ${user.username} 👋</div>`;
                } else {
                    localStorage.removeItem('user_token');
                    location.reload();
                }
            });
        } else {
            statusDiv.innerHTML = `<a href="https://discord.com/oauth2/authorize?client_id=1124438537090121738&response_type=token&redirect_uri=https%3A%2F%2Fyuris6767m-blip.github.io%2Fshifra%2F&scope=identify" style="color:gold;">تسجيل الدخول عبر ديسكورد</a>`;
        }
    </script>
</body>
</html>
