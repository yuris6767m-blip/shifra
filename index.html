<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة شفرة</title>
    <style>
        body { background: #580c10; color: white; text-align: center; font-family: sans-serif; padding: 50px; }
        .box { background: #d4af37; color: #580c10; padding: 20px; border-radius: 10px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

    <h1 id="status">جاري التحقق من الدخول...</h1>
    <div id="result"></div>

    <script>
        // 1. استخراج التوكن بطريقة أكثر قوة
        const fragment = new URLSearchParams(window.location.hash.substring(1));
        const token = fragment.get('access_token');

        if (token) {
            // 2. إذا وجدنا توكن، نرسله لـ ديسكورد
            fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(user => {
                if (user.username) {
                    document.getElementById('status').innerText = "تم الدخول بنجاح";
                    document.getElementById('result').innerHTML = `<div class="box">مرحباً بك يا ${user.username}</div>`;
                } else {
                    document.getElementById('status').innerText = "فشل التحقق من الحساب";
                }
            })
            .catch(err => {
                document.getElementById('status').innerText = "خطأ في الاتصال: " + err;
            });
        } else {
            // 3. إذا لم يوجد توكن، إظهار زر الدخول بشكل مباشر
            document.getElementById('status').innerText = "تحتاج لتسجيل الدخول";
            document.getElementById('result').innerHTML = `
                <a href="https://discord.com/oauth2/authorize?client_id=1124438537090121738&response_type=token&redirect_uri=https%3A%2F%2Fyuris6767m-blip.github.io%2Fshifra%2F&scope=identify" 
                   style="background:white; padding:10px 20px; text-decoration:none; border-radius:5px;">
                   تسجيل الدخول عبر ديسكورد
                </a>`;
        }
    </script>
</body>
</html>
