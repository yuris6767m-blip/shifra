<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة شفرة</title>
    <style>
        body { background: #580c10; color: white; text-align: center; padding: 50px; font-family: sans-serif; }
    </style>
</head>
<body>

    <h1 id="msg">جاري التحقق...</h1>

    <script>
        // دالة لجلب التوكن سواء كان في hash أو في query
        function getToken() {
            let hash = window.location.hash.substring(1);
            let search = window.location.search.substring(1);
            let params = new URLSearchParams(hash || search);
            return params.get('access_token');
        }

        const token = getToken();

        if (token) {
            fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(user => {
                document.getElementById('msg').innerHTML = `أهلاً بك يا ${user.username} 👋`;
                // تنظيف الرابط نهائياً لمنع أي مشاكل
                window.history.replaceState({}, document.title, window.location.pathname);
            })
            .catch(() => {
                document.getElementById('msg').innerText = "حدث خطأ في الاتصال، حاول مجدداً.";
            });
        } else {
            document.getElementById('msg').innerHTML = `<a href="https://discord.com/oauth2/authorize?client_id=1124438537090121738&response_type=token&redirect_uri=https%3A%2F%2Fyuris6767m-blip.github.io%2Fshifra%2F&scope=identify" style="color:gold;">اضغط هنا لتسجيل الدخول</a>`;
        }
    </script>
</body>
</html>
