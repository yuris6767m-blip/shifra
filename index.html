<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة شفرة</title>
    <style>
        body { background: #580c10; color: white; text-align: center; font-family: sans-serif; padding: 50px; }
        .user-panel { background: #d4af37; color: #580c10; padding: 15px; border-radius: 10px; display: inline-block; font-weight: bold; margin-top: 20px; }
        .login-btn { background: white; color: #580c10; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>منصة شفرة</h1>
    <div id="app">
        <a id="login-link" href="https://discord.com/oauth2/authorize?client_id=1124438537090121738&response_type=token&redirect_uri=https%3A%2F%2Fyuris6767m-blip.github.io%2Fshifra%2F&scope=identify" class="login-btn">
            تسجيل الدخول عبر ديسكورد
        </a>
    </div>

    <script>
        const app = document.getElementById('app');
        const loginLink = document.getElementById('login-link');

        // قراءة التوكن من الرابط
        const params = new URLSearchParams(window.location.hash.substring(1));
        const token = params.get('access_token');

        if (token) {
            // إخفاء زر الدخول فوراً
            loginLink.style.display = 'none';
            app.innerHTML = "جاري تحميل بياناتك...";

            fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(user => {
                // عرض الاسم دون مسح أي شيء آخر
                app.innerHTML = `<div class="user-panel">أهلاً بك يا ${user.username} 👋</div>`;
                // تنظيف الرابط
                window.history.replaceState(null, null, window.location.pathname);
            })
            .catch(() => {
                app.innerHTML = "حدث خطأ، حاول مجدداً.";
            });
        }
    </script>
</body>
</html>
