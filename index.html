<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة شفرة</title>
    <style>
        body { background: #580c10; color: white; text-align: center; font-family: sans-serif; padding: 50px; }
        .user-box { background: #d4af37; color: #580c10; padding: 15px; border-radius: 10px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

    <h1 id="main-title">منصة شفرة</h1>
    <div id="content">جاري المعالجة...</div>

    <script>
        const content = document.getElementById('content');

        // 1. إذا كان الرابط يحتوي على توكن، احفظه في الذاكرة وامسح الرابط
        if (window.location.hash.includes("access_token")) {
            const params = new URLSearchParams(window.location.hash.substring(1));
            localStorage.setItem('discord_token', params.get('access_token'));
            window.location.href = window.location.pathname; // إعادة تحميل الصفحة بدون الـ hash
        }

        // 2. إذا كان لدينا توكن مخزن، نستخدمه
        const token = localStorage.getItem('discord_token');

        if (token) {
            fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(user => {
                if (user.username) {
                    content.innerHTML = `<div class="user-box">أهلاً بك ${user.username} 👋</div>`;
                } else {
                    localStorage.removeItem('discord_token'); // التوكن منتهي
                    location.reload();
                }
            })
            .catch(() => {
                localStorage.removeItem('discord_token');
                location.reload();
            });
        } else {
            // 3. إذا لم يوجد توكن، إظهار زر الدخول
            content.innerHTML = `<a href="https://discord.com/oauth2/authorize?client_id=1124438537090121738&response_type=token&redirect_uri=https%3A%2F%2Fyuris6767m-blip.github.io%2Fshifra%2F&scope=identify" style="color:white; font-weight:bold;">تسجيل الدخول عبر ديسكورد</a>`;
        }
    </script>
</body>
</html>
